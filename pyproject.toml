[project]
name = "ds-feature-engineering"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
